name: Playwright MCP AI Self-Healing

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: |
          npm install
          npm install -D ts-node typescript @types/node

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm run test:make-apt || true

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate || true

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Detect failures
        id: detect
        run: |
          if grep -q '"status":"failed"' results.json; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Start MCP
        if: steps.detect.outputs.failed == 'true'
        run: |
          npx @playwright/mcp@latest &
          sleep 5

      - name: Analyze failures
        if: steps.detect.outputs.failed == 'true'
        run: npm run ai:analyze
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Apply fixes
        if: steps.detect.outputs.failed == 'true'
        run: |
          git checkout -b ai-fix-${{ github.run_id }}
          npm run ai:apply

      - name: Validate fixes
        if: steps.detect.outputs.failed == 'true'
        run: |
          for i in 1 2 3; do
            npx playwright test || exit 1
          done

      - name: Create PR
        if: steps.detect.outputs.failed == 'true'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai@bot.com"
          git add .
          git commit -m "AI Fix: Playwright failures" || exit 0
          git push origin HEAD

          gh pr create \
            --title "AI Fix: Playwright failures" \
            --body "Auto-generated fixes using MCP + OpenAI"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}