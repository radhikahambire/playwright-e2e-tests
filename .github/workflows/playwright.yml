name: Playwright Self-Healing Pipeline

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright-ai-healing:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      ######################################################################
      # Checkout Repository
      ######################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################################
      # Setup Node.js
      ######################################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ######################################################################
      # Install Dependencies
      ######################################################################
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."

          npm install

      ######################################################################
      # Install Playwright Browsers
      ######################################################################
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      ######################################################################
      # Install Allure CLI
      ######################################################################
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline

      ######################################################################
      # Prepare Directories
      ######################################################################
      - name: Prepare Directories
        run: |
          mkdir -p playwright-report
          mkdir -p allure-results
          mkdir -p allure-report
          mkdir -p test-results

      ######################################################################
      # Run Playwright Tests
      ######################################################################
      - name: Run Playwright Tests
        id: playwright_run
        run: |
          echo "======================================="
          echo "Running Playwright tests..."
          echo "======================================="

          EXIT_CODE=0

          npm run test:make-apt || EXIT_CODE=$?

          echo "playwright_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          echo "Playwright exit code: $EXIT_CODE"

          exit 0

      ######################################################################
      # Upload Playwright Report
      ######################################################################
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results.json
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Upload Allure Results
      ######################################################################
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Generate Allure Report
      ######################################################################
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then

            echo "Generating Allure report..."

            allure generate allure-results \
              --clean \
              -o allure-report

          else
            echo "allure-results directory not found"
          fi

      ######################################################################
      # Upload Allure HTML Report
      ######################################################################
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Validate results.json
      ######################################################################
      - name: Validate results.json
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "======================================="
          echo "Validating results.json..."
          echo "======================================="

          if [ ! -f results.json ]; then
            echo "results.json missing"
            exit 1
          fi

          node -e "
            const fs = require('fs');

            const raw = fs.readFileSync('results.json', 'utf8');

            JSON.parse(raw);

            console.log('results.json valid');
          "

      ######################################################################
      # Start Playwright MCP Server
      ######################################################################
      - name: Start Playwright MCP Server
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "======================================="
          echo "Starting MCP server..."
          echo "======================================="

          npx @playwright/mcp@latest > mcp.log 2>&1 &

          echo $! > mcp.pid

          sleep 10

          echo "MCP server started"

      ######################################################################
      # Upload MCP Logs
      ######################################################################
      - name: Upload MCP Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: mcp.log
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Analyze Failures with OpenAI
      ######################################################################
      - name: Analyze Failures with OpenAI
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          echo "======================================="
          echo "Running AI analysis..."
          echo "======================================="

          set +e

          npx tsx scripts/analyzeWithMCP.ts

          AI_EXIT_CODE=$?

          echo "AI analysis exit code: $AI_EXIT_CODE"

          exit 0

      ######################################################################
      # Upload AI Analysis
      ######################################################################
      - name: Upload AI Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            llm-output.json
            llm-prompt.txt
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Apply AI Fixes
      ######################################################################
      - name: Apply AI Fixes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          echo "======================================="
          echo "Applying AI fixes..."
          echo "======================================="

          if [ ! -f "llm-output.json" ]; then
            echo "llm-output.json not found"
            exit 0
          fi

          set +e

          npx tsx scripts/applyPatch.ts

          PATCH_EXIT_CODE=$?

          echo "Patch exit code: $PATCH_EXIT_CODE"

          exit 0

      ######################################################################
      # Verify Allowed File Changes
      ######################################################################
      - name: Verify Allowed File Changes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          echo "======================================="
          echo "Checking modified files..."
          echo "======================================="

          git diff --name-only > changed-files.txt

          cat changed-files.txt

          INVALID_FILES=$(grep -Ev '^(tests/|pages/)' changed-files.txt || true)

          if [ ! -z "$INVALID_FILES" ]; then

            echo "Unauthorized file modifications detected"

            echo "$INVALID_FILES"

            exit 1

          fi

      ######################################################################
      # Validation Run
      ######################################################################
      - name: Validation Run
        id: validation_run
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "======================================="
          echo "Running validation tests..."
          echo "======================================="

          VALIDATION_EXIT_CODE=0

          npm run test:make-apt || VALIDATION_EXIT_CODE=$?

          echo "validation_exit_code=$VALIDATION_EXIT_CODE" >> $GITHUB_OUTPUT

          echo "Validation exit code: $VALIDATION_EXIT_CODE"

          exit 0

      ######################################################################
      # Upload Validation Results
      ######################################################################
      - name: Upload Validation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            results.json
            playwright-report/
            allure-results/
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Check Validation Status
      ######################################################################
      - name: Check Validation Status
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "======================================="
          echo "Checking validation status..."
          echo "======================================="

          echo "Validation exit code:"
          echo "${{ steps.validation_run.outputs.validation_exit_code }}"

          if [ "${{ steps.validation_run.outputs.validation_exit_code }}" != "0" ]; then

            echo "Validation failed after AI fix"

            echo "AI healing unsuccessful"

            exit 1

          fi

          echo "Validation successful"

      ######################################################################
      # Create Pull Request
      ######################################################################
      - name: Create Pull Request
        if: |
          steps.playwright_run.outputs.playwright_exit_code != '0' &&
          steps.validation_run.outputs.validation_exit_code == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================="
          echo "Creating Pull Request..."
          echo "======================================="

          npx tsx scripts/createPR.ts

      ######################################################################
      # Stop MCP Server
      ######################################################################
      - name: Stop MCP Server
        if: always()
        run: |
          echo "======================================="
          echo "Stopping MCP server..."
          echo "======================================="

          if [ -f mcp.pid ]; then

            kill $(cat mcp.pid) || true

          fi

      ######################################################################
      # Upload Final Reports
      ######################################################################
      - name: Upload Final Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-results/
            allure-report/
            results.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Final Summary
      ######################################################################
      - name: Final Summary
        if: always()
        run: |
          echo "======================================="
          echo "Pipeline completed"
          echo "Playwright execution completed"
          echo "AI healing flow completed"
          echo "Validation completed"
          echo "Reports uploaded"
          echo "======================================="