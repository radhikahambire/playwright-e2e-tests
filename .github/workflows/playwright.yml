name: Playwright MCP AI Self-Healing

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: |
          npm install
          npm install -D ts-node typescript @types/node

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Run tests
        run: npm run test:make-apt || true

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate || true

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Detect failures
        id: detect
        run: |
          if [ -f results.json ] && grep -q '"status":"failed"' results.json; then
            FAILED=$(node -e "try { console.log(require('./results.json').stats.expected - require('./results.json').stats.passed) } catch { console.log(1) }")
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "count=$FAILED" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Start MCP
        if: steps.detect.outputs.failed == 'true'
        run: |
          npx @playwright/mcp@latest > /tmp/mcp.log 2>&1 &
          MCP_PID=$!
          echo $MCP_PID > /tmp/mcp.pid
          sleep 3
          if ps -p $MCP_PID > /dev/null 2>&1; then
            echo "✓ MCP server started (PID: $MCP_PID)"
          else
            echo "⚠ MCP server may have failed, continuing..."
            cat /tmp/mcp.log || true
          fi

      - name: Analyze failures
        if: steps.detect.outputs.failed == 'true'
        run: npm run ai:analyze
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Apply fixes
        if: steps.detect.outputs.failed == 'true'
        id: apply-fixes
        run: |
          git checkout -b ai-fix-${{ github.run_id }}
          npm run ai:apply
        continue-on-error: true

      - name: Validate fixes (Run 1)
        if: steps.apply-fixes.outcome == 'success' || steps.apply-fixes.outcome == 'skipped'
        id: validate-1
        run: npm run test:make-apt || true
        continue-on-error: true

      - name: Validate fixes (Run 2)
        if: steps.validate-1.outcome != 'skipped'
        id: validate-2
        run: npm run test:make-apt || true
        continue-on-error: true

      - name: Validate fixes (Run 3)
        if: steps.validate-2.outcome != 'skipped'
        id: validate-3
        run: npm run test:make-apt || true
        continue-on-error: true

      - name: Check validation results
        id: check-validation
        run: |
          if [ -f results.json ]; then
            FAILED=$(node -e "try { console.log(require('./results.json').stats.expected - require('./results.json').stats.passed) } catch { console.log(0) }")
            if [ "$FAILED" -eq 0 ]; then
              echo "passed=true" >> $GITHUB_OUTPUT
            else
              echo "passed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create PR
        if: |
          steps.detect.outputs.failed == 'true' && 
          steps.check-validation.outputs.passed == 'true' &&
          github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          FAILED_COUNT: ${{ steps.detect.outputs.count }}
        run: |
          git config user.name "playwright-ai-bot"
          git config user.email "bot@playwright-ai.local"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add tests/ page-objects/
            git commit -m "fix: auto-heal failing tests using AI

Auto-healed failures:
- Run ID: $RUN_ID
- Failed tests: $FAILED_COUNT
- Branch: ai-fix-$RUN_ID"
            
            git push origin ai-fix-$RUN_ID
            
            TITLE="🤖 AI Auto-Fix: Healed $FAILED_COUNT failing test(s)"
            BODY="### Auto-Generated Test Fixes

Tests Fixed: $FAILED_COUNT

Process:
1. ✓ Detected test failures
2. ✓ Started Playwright MCP for DOM analysis
3. ✓ Analyzed with OpenAI GPT-4
4. ✓ Applied minimal fixes to selectors/page-objects
5. ✓ Re-validated with 3 consecutive runs

Safety Checks:
- ✓ No test.skip() added
- ✓ No hard waits added
- ✓ No assertions removed
- ✓ All runs passed

---
Generated by Playwright AI Self-Healing Pipeline"
            
            gh pr create --title "$TITLE" --body "$BODY"
          fi
        continue-on-error: true

      - name: Cleanup MCP
        if: always() && steps.detect.outputs.failed == 'true'
        run: |
          if [ -f /tmp/mcp.pid ]; then
            kill $(cat /tmp/mcp.pid) 2>/dev/null || true
            sleep 1
          fi
          echo "✓ MCP cleanup complete"