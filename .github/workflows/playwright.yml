name: Playwright Self-Healing Pipeline

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright-ai-healing:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUNNER: ${{ secrets.RUNNER }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      ######################################################################
      # Checkout Repository
      ######################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################################
      # Setup Node.js
      ######################################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ######################################################################
      # Install Dependencies
      ######################################################################
      - name: Install Dependencies
        run: |
          npm install

      ######################################################################
      # Install Playwright Browsers
      ######################################################################
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      ######################################################################
      # Install Allure CLI
      ######################################################################
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline

      ######################################################################
      # Prepare Directories
      ######################################################################
      - name: Prepare Directories
        run: |
          mkdir -p playwright-report
          mkdir -p allure-results
          mkdir -p allure-report
          mkdir -p test-results

      ######################################################################
      # Run Playwright Tests
      ######################################################################
      - name: Run Playwright Tests
        id: playwright_run
        run: |
          echo "======================================="
          echo "Running Playwright tests..."
          echo "======================================="

          EXIT_CODE=0

          npm run test:make-apt || EXIT_CODE=$?

          echo "playwright_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          echo "Playwright exit code: $EXIT_CODE"

          exit 0

      ######################################################################
      # Upload Initial Reports
      ######################################################################
      - name: Upload Initial Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-test-reports
          path: |
            playwright-report/
            results.json
            allure-results/
          if-no-files-found: ignore

      ######################################################################
      # Generate Allure Report
      ######################################################################
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results \
              --clean \
              -o allure-report
          fi

      ######################################################################
      # Upload Allure HTML Report
      ######################################################################
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: ignore

      ######################################################################
      # Validate results.json
      ######################################################################
      - name: Validate results.json
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          if [ ! -f results.json ]; then
            echo "results.json missing"
            exit 1
          fi

          node -e "
            const fs = require('fs');

            JSON.parse(
              fs.readFileSync('results.json', 'utf8')
            );

            console.log('results.json valid');
          "

      ######################################################################
      # Start MCP Server
      ######################################################################
      - name: Start Playwright MCP Server
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          npx @playwright/mcp@latest > mcp.log 2>&1 &

          echo $! > mcp.pid

          sleep 10

      ######################################################################
      # Upload MCP Logs
      ######################################################################
      - name: Upload MCP Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: mcp.log
          if-no-files-found: ignore

      ######################################################################
      # Analyze Failures
      ######################################################################
      - name: Analyze Failures with OpenAI
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          echo "Running AI analysis..."

          set +e

          npx tsx scripts/analyzeWithMCP.ts

          echo "AI analysis completed"

          exit 0

      ######################################################################
      # Upload AI Analysis
      ######################################################################
      - name: Upload AI Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            llm-output.json
            llm-prompt.txt
          if-no-files-found: ignore

      ######################################################################
      # Apply AI Fixes
      ######################################################################
      - name: Apply AI Fixes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          if [ ! -f "llm-output.json" ]; then
            echo "No AI output found"
            exit 0
          fi

          set +e

          npx tsx scripts/applyPatch.ts

          echo "Patch application completed"

          exit 0

      ######################################################################
      # Verify Allowed File Changes
      ######################################################################
      - name: Verify Allowed File Changes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        continue-on-error: true
        run: |
          git diff --name-only > changed-files.txt

          INVALID_FILES=$(grep -Ev '^(tests/|pages/)' changed-files.txt || true)

          if [ ! -z "$INVALID_FILES" ]; then

            echo "Unauthorized file modifications detected"

            echo "$INVALID_FILES"

          fi

          exit 0

      ######################################################################
      # Validation Run
      ######################################################################
      - name: Validation Run
        id: validation_run
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          VALIDATION_EXIT_CODE=0

          npm run test:make-apt || VALIDATION_EXIT_CODE=$?

          echo "validation_exit_code=$VALIDATION_EXIT_CODE" >> $GITHUB_OUTPUT

          echo "Validation exit code: $VALIDATION_EXIT_CODE"

          exit 0

      ######################################################################
      # Upload Validation Reports
      ######################################################################
      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            playwright-report/
            allure-results/
            results.json
          if-no-files-found: ignore

      ######################################################################
      # Validation Summary
      ######################################################################
      - name: Validation Summary
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "======================================="
          echo "Validation Exit Code:"
          echo "${{ steps.validation_run.outputs.validation_exit_code }}"
          echo "======================================="

          if [ "${{ steps.validation_run.outputs.validation_exit_code }}" != "0" ]; then

            echo "AI healing could not fully fix the issue"

          else

            echo "AI healing successful"

          fi

      ######################################################################
      # Create Pull Request
      ######################################################################
      - name: Create Pull Request
        if: |
          steps.playwright_run.outputs.playwright_exit_code != '0' &&
          steps.validation_run.outputs.validation_exit_code == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          npx tsx scripts/createPR.ts

      ######################################################################
      # Stop MCP Server
      ######################################################################
      - name: Stop MCP Server
        if: always()
        run: |
          if [ -f mcp.pid ]; then
            kill $(cat mcp.pid) || true
          fi

      ######################################################################
      # Upload Final Reports
      ######################################################################
      - name: Upload Final Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-results/
            allure-report/
            results.json
            test-results/
          if-no-files-found: ignore

      ######################################################################
      # Final Summary
      ######################################################################
      - name: Final Summary
        if: always()
        run: |
          echo "======================================="
          echo "Pipeline completed"
          echo "Playwright execution completed"
          echo "AI healing completed"
          echo "Validation completed"
          echo "Reports uploaded"
          echo "======================================="