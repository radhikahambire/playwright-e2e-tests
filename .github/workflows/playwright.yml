name: Playwright Self-Healing Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-self-heal:
    name: Playwright Test + AI Self Healing
    runs-on: ubuntu-latest

    timeout-minutes: 180

    env:
      CI: true
      NODE_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      ######################################################################
      # Checkout Repository
      ######################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ######################################################################
      # Setup Node.js
      ######################################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ######################################################################
      # Install Dependencies
      ######################################################################
      - name: Install Dependencies
        run: npm install

      ######################################################################
      # Install Playwright Browsers
      ######################################################################
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      ######################################################################
      # Install Allure CLI
      ######################################################################
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      ######################################################################
      # Prepare Report Directories
      ######################################################################
      - name: Prepare Report Directories
        run: |
          mkdir -p playwright-report
          mkdir -p allure-results
          mkdir -p allure-report
          mkdir -p test-results

      ######################################################################
      # Run Playwright Tests
      ######################################################################
      - name: Run Playwright Tests
        id: initial_test
        continue-on-error: true
        run: |
          echo "Running Playwright tests..."

          npm run test:make-apt

      ######################################################################
      # Upload Playwright HTML Report
      ######################################################################
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Upload JSON Results
      ######################################################################
      - name: Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: results.json
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Upload Allure Results
      ######################################################################
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Generate Allure HTML Report
      ######################################################################
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results \
              --clean \
              -o allure-report
          fi

      ######################################################################
      # Upload Allure HTML Report
      ######################################################################
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: warn

      ######################################################################
      # Detect Failed Tests
      ######################################################################
      - name: Detect Failed Tests
        id: detect_failures
        shell: bash
        run: |
          echo "Checking Playwright results..."

          if [ ! -f results.json ]; then
            echo "results.json not found"
            echo "failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FAILED_COUNT=$(node -e "
            const fs = require('fs');

            const report = JSON.parse(
              fs.readFileSync('results.json', 'utf8')
            );

            let failed = 0;

            function walkSuites(suites) {
              for (const suite of suites || []) {

                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    for (const result of test.results || []) {

                      if (result.status === 'failed') {
                        failed++;
                      }

                    }
                  }
                }

                if (suite.suites) {
                  walkSuites(suite.suites);
                }
              }
            }

            walkSuites(report.suites || []);

            console.log(failed);
          ")

          echo "Failed tests count: $FAILED_COUNT"

          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "Playwright failures detected"
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            echo "No failures detected"
          fi

      ######################################################################
      # Upload Runtime State
      ######################################################################
      - name: Upload Runtime State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-state
          path: |
            results.json
            playwright-report
            allure-results
          if-no-files-found: ignore

      ######################################################################
      # Start Playwright MCP Server
      ######################################################################
      - name: Start Playwright MCP Server
        if: steps.detect_failures.outputs.failed == 'true'
        run: |
          echo "Starting MCP server..."

          npx @playwright/mcp@latest > mcp.log 2>&1 &

          echo $! > mcp.pid

          sleep 10

          echo "MCP server started"

      ######################################################################
      # Upload MCP Logs
      ######################################################################
      - name: Upload MCP Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: mcp.log
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Analyze Failures with AI
      ######################################################################
      - name: Analyze Failures with OpenAI
        if: steps.detect_failures.outputs.failed == 'true'
        run: |
          echo "Running AI failure analysis..."

          npx tsx scripts/analyzeWithMCP.ts

      ######################################################################
      # Upload AI Analysis
      ######################################################################
      - name: Upload AI Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            llm-output.json
            llm-prompt.txt
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Apply AI Fixes
      ######################################################################
      - name: Apply AI Fixes
        if: steps.detect_failures.outputs.failed == 'true'
        run: |
          echo "Applying AI-generated patches..."

          npx tsx scripts/applyPatch.ts

      ######################################################################
      # Verify Allowed File Changes
      ######################################################################
      - name: Verify Allowed File Changes
        if: steps.detect_failures.outputs.failed == 'true'
        shell: bash
        run: |
          echo "Checking modified files..."

          git diff --name-only > changed-files.txt

          cat changed-files.txt

          INVALID_FILES=$(grep -Ev '^(tests/|pages/)' changed-files.txt || true)

          if [ ! -z "$INVALID_FILES" ]; then
            echo "Unauthorized file modification detected"

            echo "$INVALID_FILES"

            exit 1
          fi

      ######################################################################
      # Validation Run 1
      ######################################################################
      - name: Validate Fixes - Run 1
        if: steps.detect_failures.outputs.failed == 'true'
        continue-on-error: true
        run: |
          echo "Validation run 1"

          npm run test:make-apt

      ######################################################################
      # Validation Run 2
      ######################################################################
      - name: Validate Fixes - Run 2
        if: steps.detect_failures.outputs.failed == 'true'
        continue-on-error: true
        run: |
          echo "Validation run 2"

          npm run test:make-apt

      ######################################################################
      # Validation Run 3
      ######################################################################
      - name: Validate Fixes - Run 3
        if: steps.detect_failures.outputs.failed == 'true'
        continue-on-error: true
        run: |
          echo "Validation run 3"

          npm run test:make-apt

      ######################################################################
      # Validate Final Results
      ######################################################################
      - name: Check Validation Results
        if: steps.detect_failures.outputs.failed == 'true'
        run: |
          npx tsx scripts/validateFixes.ts

      ######################################################################
      # Create Pull Request
      ######################################################################
      - name: Create Pull Request
        if: steps.detect_failures.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/createPR.ts

      ######################################################################
      # Stop MCP Server
      ######################################################################
      - name: Stop MCP Server
        if: always()
        run: |
          if [ -f mcp.pid ]; then
            echo "Stopping MCP server"

            kill $(cat mcp.pid) || true
          fi

      ######################################################################
      # Upload Final Reports
      ######################################################################
      - name: Upload Final Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-report/
            allure-results/
            results.json
          retention-days: 7
          if-no-files-found: ignore

      ######################################################################
      # Final Pipeline Summary
      ######################################################################
      - name: Pipeline Summary
        if: always()
        run: |
          echo "======================================="
          echo "Pipeline completed"
          echo "Playwright execution finished"
          echo "AI healing flow evaluated"
          echo "Artifacts uploaded"
          echo "Reports generated"
          echo "======================================="