name: Playwright Self-Healing Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=line,json,html --output=playwright-report --reporter-options outputFile=results.json
        continue-on-error: true

      - name: Generate Allure report
        run: |
          npx allure-commandline generate allure-results --clean -o allure-report || true

      - name: Detect test failures
        id: detect
        run: |
          if grep -q '"status":"failed"' results.json; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Start Playwright MCP
        if: steps.detect.outputs.failed == 'true'
        run: |
          nohup npx playwright open --mcp-server & echo $! > mcp.pid
          sleep 10

      - name: Analyze failures with AI
        if: steps.detect.outputs.failed == 'true'
        run: npx ts-node scripts/analyzeWithMCP.ts

      - name: Apply AI fixes
        if: steps.detect.outputs.failed == 'true'
        run: npx ts-node scripts/applyPatch.ts

      - name: Validate fixes - Run 1
        if: steps.detect.outputs.failed == 'true'
        run: npx playwright test --reporter=line,json --output=playwright-validation1 --reporter-options outputFile=results1.json
        continue-on-error: true

      - name: Validate fixes - Run 2
        if: steps.detect.outputs.failed == 'true'
        run: npx playwright test --reporter=line,json --output=playwright-validation2 --reporter-options outputFile=results2.json
        continue-on-error: true

      - name: Validate fixes - Run 3
        if: steps.detect.outputs.failed == 'true'
        run: npx playwright test --reporter=line,json --output=playwright-validation3 --reporter-options outputFile=results3.json
        continue-on-error: true

      - name: Check validation results
        if: steps.detect.outputs.failed == 'true'
        run: |
          if grep -q '"status":"failed"' results1.json results2.json results3.json; then
            echo "Tests still failing after self-heal attempt."
            exit 0
          else
            echo "Healed successfully."
          fi

      - name: Create Pull Request
        if: steps.detect.outputs.failed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "AI Self-Healed Playwright Tests"
          branch: ai/self-heal-${{ github.run_id }}
          title: "AI Self-Healed Playwright Tests"
          body: "Playwright tests healed automatically by AI analysis."
          base: main

      - name: Stop MCP Server
        if: steps.detect.outputs.failed == 'true'
        run: |
          if [ -f mcp.pid ]; then kill $(cat mcp.pid) || true; fi
