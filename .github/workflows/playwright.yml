name: Playwright Self-Healing Pipeline

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright-ai-healing:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      ######################################################################
      # Checkout
      ######################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################################
      # Setup Node
      ######################################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ######################################################################
      # Install Dependencies
      ######################################################################
      - name: Install Dependencies
        run: |
          npm install

      ######################################################################
      # Install Playwright Browsers
      ######################################################################
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      ######################################################################
      # Install Allure
      ######################################################################
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline

      ######################################################################
      # Prepare Directories
      ######################################################################
      - name: Prepare Directories
        run: |
          mkdir -p playwright-report
          mkdir -p allure-results
          mkdir -p allure-report
          mkdir -p test-results

      ######################################################################
      # Run Tests
      ######################################################################
      - name: Run Playwright Tests
        id: playwright_run
        run: |
          echo "Running Playwright tests..."

          EXIT_CODE=0

          npm run test:make-apt || EXIT_CODE=$?

          echo "playwright_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          echo "Playwright exit code: $EXIT_CODE"

          exit 0

      ######################################################################
      # Upload Reports
      ######################################################################
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results.json
          if-no-files-found: warn

      ######################################################################
      # Upload Allure Results
      ######################################################################
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      ######################################################################
      # Generate Allure Report
      ######################################################################
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results \
              --clean \
              -o allure-report
          fi

      ######################################################################
      # Upload Allure HTML
      ######################################################################
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn

      ######################################################################
      # Validate JSON
      ######################################################################
      - name: Validate results.json
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          if [ ! -f results.json ]; then
            echo "results.json missing"
            exit 1
          fi

          node -e "
            const fs = require('fs');

            JSON.parse(
              fs.readFileSync('results.json', 'utf8')
            );

            console.log('results.json valid');
          "

      ######################################################################
      # Start MCP
      ######################################################################
      - name: Start Playwright MCP Server
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "Starting MCP server..."

          npx @playwright/mcp@latest > mcp.log 2>&1 &

          echo $! > mcp.pid

          sleep 10

      ######################################################################
      # Upload MCP Logs
      ######################################################################
      - name: Upload MCP Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: mcp.log
          if-no-files-found: ignore

      ######################################################################
      # Analyze Failures
      ######################################################################
      - name: Analyze Failures with OpenAI
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          echo "Running AI analysis..."

          npx tsx scripts/analyzeWithMCP.ts

      ######################################################################
      # Upload AI Analysis
      ######################################################################
      - name: Upload AI Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            llm-output.json
            llm-prompt.txt
          if-no-files-found: ignore

      ######################################################################
      # Apply AI Fixes
      ######################################################################
      - name: Apply AI Fixes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          npx tsx scripts/applyPatch.ts

      ######################################################################
      # Verify Allowed Files
      ######################################################################
      - name: Verify Allowed File Changes
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          git diff --name-only > changed-files.txt

          INVALID_FILES=$(grep -Ev '^(tests/|pages/)' changed-files.txt || true)

          if [ ! -z "$INVALID_FILES" ]; then
            echo "Unauthorized file modifications detected"

            echo "$INVALID_FILES"

            exit 1
          fi

      ######################################################################
      # Validation Run
      ######################################################################
      - name: Validation Run
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        run: |
          npm run test:make-apt || true

      ######################################################################
      # Create Pull Request
      ######################################################################
      - name: Create Pull Request
        if: steps.playwright_run.outputs.playwright_exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/createPR.ts

      ######################################################################
      # Stop MCP
      ######################################################################
      - name: Stop MCP Server
        if: always()
        run: |
          if [ -f mcp.pid ]; then
            kill $(cat mcp.pid) || true
          fi

      ######################################################################
      # Final Reports
      ######################################################################
      - name: Upload Final Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-results/
            allure-report/
            results.json
          if-no-files-found: ignore

      ######################################################################
      # Final Summary
      ######################################################################
      - name: Final Summary
        if: always()
        run: |
          echo "Pipeline completed"